name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SocialMediaApp.Api/SocialMediaApp.Api.csproj

      - name: Build
        run: dotnet build SocialMediaApp.Api/SocialMediaApp.Api.csproj --no-restore --configuration Release

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: socialmediaapp-client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: socialmediaapp-client

      - name: Build
        run: npm run build
        working-directory: socialmediaapp-client

      - name: Test
        run: dotnet test SocialMediaApp.Tests/SocialMediaApp.Tests.csproj --configuration Release
